name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

env:
  BACKEND_DIR: backend
  DOCKER_IMAGE: lyduybach/tlu_lab_mornitoring

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: datn
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check Java formatting
        working-directory: ${{ env.BACKEND_DIR }}
        run: mvn -B spotless:check

      - name: Compile and test
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          JWT: ${{ secrets.CI_JWT }}
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/datn?serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn -B clean test

      - name: Package backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -t "${{ env.DOCKER_IMAGE }}:latest" "${{ env.BACKEND_DIR }}"

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${{ env.DOCKER_IMAGE }}:latest" "${{ env.BACKEND_DIR }}"

      - name: Push Docker image
        run: docker push "${{ env.DOCKER_IMAGE }}:latest"

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull backend
            docker compose up -d backend
