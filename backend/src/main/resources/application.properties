spring.application.name=backend
server.port = 8080
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/datn?serverTimezone=UTC
spring.datasource.username = root
spring.datasource.password = root
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.defer-datasource-initialization = true
logging.level.root = error
logging.level.com.bachld.backend.websocket = debug
logging.level.com.bachld.backend.controller.VncController = debug
jwt.secret-key = ${JWT}
jwt.expire-minute = 1440

# Security keys
security.rsa-private-key = ${APP_RSA_PRIVATE_KEY:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

storage.screenshot-dir = ${SCREENSHOT_STORAGE_DIR:uploads/screenshots}
storage.screenshot-url-path = /resources/images/screenshots
storage.shared-file-dir = ${SHARED_FILE_STORAGE_DIR:uploads/shared-files-temp}
app.public-base-url = ${APP_PUBLIC_BASE_URL:http://localhost:8080}

vnc.server.port = 5900
