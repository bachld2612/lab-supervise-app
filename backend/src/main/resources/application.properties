spring.application.name=backend
server.port = 8080
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/datn?serverTimezone=UTC
spring.datasource.username = root
spring.datasource.password = root
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.defer-datasource-initialization = true
logging.level.root = error
jwt.secret-key = ${JWT}
jwt.expire-minute = 1440

# Veyon security keys
veyon.rsa-private-key = ${VEYON_RSA_PRIVATE_KEY:}
veyon.secret-key = ${VEYON_SECRET:veyon-default-secret-key-change-in-prod}

# Veyon API endpoints
veyon.api.login = http://{{teacher_ip}}:11080/api/v1/authentication/{{student_ip}}
veyon.api.lock-screen = http://{{teacher_ip}}:11080/api/v1/feature/ccb535a2-1d24-4cc1-a709-8b47d2b2ac79
veyon.api.screenshot = http://{{teacher_ip}}:11080/api/v1/framebuffer?format=png&compression=9&quality=100

# Veyon screenshot retry (framebuffer cần thời gian khởi tạo sau khi auth)
veyon.screenshot.max-retries = 5
veyon.screenshot.retry-delay-ms = 1000